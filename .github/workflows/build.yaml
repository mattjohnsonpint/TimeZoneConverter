name: build

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Resolve .NET SDK version on macOS
          if: runner.os == 'macOS'
          id: sdk-version
          run: |
            version=$(curl --fail --silent --show-error --location --retry 3 https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0/latest.version)
            echo "version=$version" >> "$GITHUB_OUTPUT"

        - name: Cache .NET SDK archive on macOS
          if: runner.os == 'macOS'
          id: sdk-archive
          uses: actions/cache@v6
          with:
            path: ${{ runner.temp }}/dotnet-sdk-downloads
            key: dotnet-sdk-archive-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-version.outputs.version }}

        - name: Download .NET SDK archive on macOS
          if: runner.os == 'macOS' && steps.sdk-archive.outputs.cache-hit != 'true'
          env:
            SDK_VERSION: ${{ steps.sdk-version.outputs.version }}
            SDK_DOWNLOAD_DIR: ${{ runner.temp }}/dotnet-sdk-downloads
          run: |
            mkdir -p "$SDK_DOWNLOAD_DIR"
            sdk_arch=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
            curl --fail --show-error --location --retry 3 "https://builds.dotnet.microsoft.com/dotnet/Sdk/$SDK_VERSION/dotnet-sdk-$SDK_VERSION-osx-$sdk_arch.tar.gz" --output "$SDK_DOWNLOAD_DIR/sdk.tar.gz"

        - name: Install cached .NET SDK on macOS
          if: runner.os == 'macOS'
          env:
            SDK_DOWNLOAD_DIR: ${{ runner.temp }}/dotnet-sdk-downloads
          run: |
            mkdir -p "$HOME/.dotnet"
            tar -xzf "$SDK_DOWNLOAD_DIR/sdk.tar.gz" -C "$HOME/.dotnet"

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            # Only Linux runs the .NET 8 and 9 tests.
            dotnet-version: |
              10.0.x
              ${{ runner.os == 'Linux' && '8.0.x' || '' }}
              ${{ runner.os == 'Linux' && '9.0.x' || '' }}
            cache: true
            cache-dependency-path: '**/packages.lock.json'

        - name: Update tzdata on Linux
          if: runner.os == 'Linux'
          run: | 
            sudo apt-get update
            sudo apt-get install -y tzdata tzdata-legacy
          env:
            DEBIAN_FRONTEND: noninteractive

        - name: Update tzdata on macOS
          if: runner.os == 'macOS'
          run: |
            source_dir="$RUNNER_TEMP/tzdata-source"
            zoneinfo_dir="$RUNNER_TEMP/zoneinfo"
            mkdir -p "$source_dir" "$zoneinfo_dir"
            curl --fail --show-error --location --retry 3 "https://data.iana.org/time-zones/tzdata-latest.tar.gz" --output "$source_dir/tzdata.tar.gz"
            tar -xzf "$source_dir/tzdata.tar.gz" -C "$source_dir"
            cd "$source_dir"
            /usr/sbin/zic -b fat -d "$zoneinfo_dir" africa antarctica asia australasia europe northamerica southamerica etcetera factory backward
            cp zone.tab zone1970.tab iso3166.tab "$zoneinfo_dir/"
            cp version "$zoneinfo_dir/+VERSION"
            cat "$zoneinfo_dir/+VERSION"
            echo "TZDIR=$zoneinfo_dir" >> "$GITHUB_ENV"

        - name: Restore
          run: dotnet restore TimeZoneConverter.sln --nologo --locked-mode

        - name: Build
          run: dotnet build -c Release --nologo --no-restore

        - name: Test .NET 10
          run: dotnet test --test-modules "test/**/bin/Release/net10.0/*.Tests.dll" --report-xunit-trx

        - name: Test .NET 8 and 9 on Linux
          if: runner.os == 'Linux'
          run: |
            dotnet test --test-modules "test/**/bin/Release/net8.0/*.Tests.dll" --report-xunit-trx
            dotnet test --test-modules "test/**/bin/Release/net9.0/*.Tests.dll" --report-xunit-trx

        - name: Test .NET Framework on Windows
          if: runner.os == 'Windows'
          run: dotnet test --test-modules "test/**/bin/Release/net48/win-x64/*.Tests.exe" --report-xunit-trx

        - name: Benchmark .NET 10
          run: dotnet test --project test/TimeZoneConverter.Benchmarks -c Release -f net10.0 --no-build --report-xunit-trx

        - name: Archive benchmark results
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: benchmarks-${{ runner.os }}
            path: '**/BenchmarkDotNet.Artifacts/**'
            if-no-files-found: ignore
