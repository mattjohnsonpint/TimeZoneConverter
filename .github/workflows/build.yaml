name: build

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # NOTE: use macos-15-intel because tzdata on macos-latest is outdated
    # See https://github.com/actions/runner-images/issues/13237

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]

    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            # Install all runtimes needed by the multi-targeted tests.
            dotnet-version: |
              8.0.x
              9.0.x
              10.0.x
            cache: true
            cache-dependency-path: '**/packages.lock.json'

        - name: Update tzdata on Linux
          if: runner.os == 'Linux'
          run: | 
            sudo apt-get update
            sudo apt-get install -y tzdata
            sudo dpkg --remove --force-depends tzdata-legacy
          env:
            DEBIAN_FRONTEND: noninteractive

        - name: Check tzdata version on MacOS
          if: runner.os == 'macOS'
          run: cat /usr/share/zoneinfo/+VERSION 

        - name: Restore
          run: dotnet restore --nologo --locked-mode

        - name: Build
          run: dotnet build -c Release --nologo --no-restore

        - name: Test
          run: dotnet test -c Release --nologo --no-build -l GitHubActions -l "trx;LogFilePrefix=testresults_${{ runner.os }}"

        - name: Archive benchmark results
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: benchmarks-${{ runner.os }}
            path: '**/BenchmarkDotNet.Artifacts/**'
            if-no-files-found: ignore
